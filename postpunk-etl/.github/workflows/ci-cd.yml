name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: postpunk/postpunk-etl

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint Code
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Lint Python files
        run: |
          # Check DAGs and jobs
          flake8 dags/ jobs/ api/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 dags/ jobs/ api/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check Python formatting
        run: |
          black --check dags/ jobs/ api/
          isort --check-only dags/ jobs/ api/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./web
        run: npm ci

      - name: Lint frontend
        working-directory: ./web
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    name: Test Application
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov httpx fastapi

      - name: Test API
        run: |
          cd api
          python -m pytest --version || echo "No tests found, skipping"

      - name: Build frontend
        working-directory: ./web
        run: |
          npm ci
          npm run build

  build:
    runs-on: ubuntu-latest
    name: Build and Push Image
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build frontend
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Kubernetes
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy MeiliSearch
        run: |
          helm upgrade --install meilisearch charts/meili/ \
            --namespace default \
            --wait \
            --timeout 5m

      - name: Deploy MongoDB
        run: |
          helm upgrade --install mongodb charts/mongo/ \
            --namespace default \
            --wait \
            --timeout 5m

      - name: Deploy Airflow
        run: |
          helm upgrade --install airflow charts/airflow/ \
            --namespace default \
            --wait \
            --timeout 10m

      - name: Deploy PostPunk Web
        run: |
          helm upgrade --install postpunk-web charts/postpunk-web/ \
            --namespace default \
            --set image.tag=${{ github.sha }} \
            --wait \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl get pods -l app.kubernetes.io/name=postpunk-web
          kubectl get ingress

  notify:
    runs-on: ubuntu-latest
    name: Notify Deployment
    needs: deploy
    if: always()
    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "🎸 PostPunk ETL deployed successfully!"
            echo "🔍 Access at: http://postpunk.local"
            echo "📊 API docs: http://postpunk.local/api/docs"
          else
            echo "❌ Deployment failed"
            exit 1
          fi